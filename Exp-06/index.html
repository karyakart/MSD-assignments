<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 6: Web-based Node.js Application</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-bottom: 5px;
    }
    .meta {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #0284c7;
      color: white;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    .box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      color: #34d399;
      white-space: pre-wrap;
      font-size: 13px;
      min-height: 120px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Experiment 6: Web-Based Node.js Application</h1>
    <p class="meta">Subject: MERN Stack Development | D.Y. Patil College of Engg. & Tech.</p>

    <div class="btn-group">
      <button onclick="fetchData('/api/student')">Fetch Student Details (JSON)</button>
      <button onclick="fetchData('/api/info')">Fetch Server Diagnostics</button>
      <button onclick="fetchText('/about')">Fetch About Route</button>
    </div>

    <h3>Server Response Output:</h3>
    <div id="output" class="box">Click any button above to make an HTTP request to the Node.js server...</div>
  </div>

  <script>
    async function fetchData(endpoint) {
      const output = document.getElementById('output');
      output.innerText = 'Requesting ' + endpoint + '...';
      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        output.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        output.innerText = 'Error: ' + err.message;
      }
    }

    async function fetchText(endpoint) {
      const output = document.getElementById('output');
      output.innerText = 'Requesting ' + endpoint + '...';
      try {
        const res = await fetch(endpoint);
        const text = await res.text();
        output.innerText = text;
      } catch (err) {
        output.innerText = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
